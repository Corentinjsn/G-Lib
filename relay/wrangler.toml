# The G-Lib relay: Steam sign-in and friends, holding the Steam Web API key so
# the app never has to. Secrets are set with `wrangler secret put`, never here.
name = "g-lib-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# 30 requests a minute per address: a sign-in and an open friends window use a
# handful. Past that, the relay answers 429 instead of spending its Steam and
# Epic quotas.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
