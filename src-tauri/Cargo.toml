[package]
name = "gamlib"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamlib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56.0"
quick-xml = "0.42.0"
walkdir = "2.5.0"
dirs = "6.0.0"
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.23.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri-plugin-window-state = "2.4.1"

